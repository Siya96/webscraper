spring:
  application:
    name: stock-data-service

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/stockpulse}
    username: ${POSTGRES_USER:stockpulse}
    password: ${POSTGRES_PASSWORD:stockpulse_secret}
    hikari:
      maximum-pool-size: 10

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      acks: 1
      compression-type: lz4

alpha-vantage:
  api-key: ${ALPHA_VANTAGE_KEY:demo}
  base-url: https://www.alphavantage.co

fmp:
  api-key: ${FMP_API_KEY:demo}
  base-url: https://financialmodelingprep.com/api/v3

server:
  port: 8083