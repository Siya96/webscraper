spring:
  application:
    name: websocket-service
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: websocket-group
      auto-offset-reset: latest
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
server:
  port: 8085
---
spring:
  config:
    activate:
      on-profile: docker
  kafka:
    bootstrap-servers: kafka:29092
  data:
    redis:
      host: redis
