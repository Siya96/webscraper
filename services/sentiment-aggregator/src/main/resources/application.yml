spring:
  application:
    name: sentiment-aggregator

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/stockpulse}
    username: ${POSTGRES_USER:stockpulse}
    password: ${POSTGRES_PASSWORD:stockpulse_secret}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: sentiment-aggregator-group
      auto-offset-reset: latest
      enable-auto-commit: false
      max-poll-records: 500
    producer:
      acks: 1
      compression-type: lz4
      batch-size: 65536
      linger-ms: 50

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  elasticsearch:
    uris: ${ES_URL:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s

finbert:
  url: ${FINBERT_URL:http://localhost:5000}
  batch-size: 32
  timeout-seconds: 15

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.stockpulse: INFO
    org.springframework.kafka: WARN
    org.hibernate: WARN

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/stockpulse
  data:
    redis:
      host: redis
  elasticsearch:
    uris: http://elasticsearch:9200
  kafka:
    bootstrap-servers: kafka:29092
finbert:
  url: http://finbert-service:5000