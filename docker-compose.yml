# docker-compose.yml
version: '3.9'

networks:
  stockpulse-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  es-data:
  kafka-data:

services:

  # ─── Infrastructure ──────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [stockpulse-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 8760       # 1 year retention
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [stockpulse-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on: [kafka]
    networks: [stockpulse-net]

  postgres:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stockpulse
      POSTGRES_USER: stockpulse
      POSTGRES_PASSWORD: stockpulse_secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [stockpulse-net]

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis-data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks: [stockpulse-net]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx2g"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [stockpulse-net]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on: [elasticsearch]
    networks: [stockpulse-net]

  # ─── Application Services ────────────────────────────────────────

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on: [kafka, redis, postgres]
    networks: [stockpulse-net]

  stock-data-service:
    build: ./services/stock-data-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ALPHA_VANTAGE_KEY: ${ALPHA_VANTAGE_KEY}
      FMP_API_KEY: ${FMP_API_KEY}
    depends_on: [kafka, postgres]
    networks: [stockpulse-net]

  sentiment-aggregator:
    build: ./services/sentiment-aggregator
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on: [kafka, redis, elasticsearch, postgres]
    networks: [stockpulse-net]

  websocket-service:
    build: ./services/websocket-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on: [kafka, redis]
    networks: [stockpulse-net]

  scraper-cluster:
    build: ./services/scraper-cluster
    deploy:
      replicas: 4
    environment:
      KAFKA_BROKERS: kafka:29092
      FINBERT_URL: http://finbert-service:5000
      PROXY_LIST: ${PROXY_LIST}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID}
      REDDIT_SECRET: ${REDDIT_SECRET}
    depends_on: [kafka, finbert-service]
    networks: [stockpulse-net]

  finbert-service:
    build: ./services/finbert-service
    ports:
      - "5000:5000"
    environment:
      MODEL_CACHE_DIR: /models
    volumes:
      - ./models:/models
    networks: [stockpulse-net]